services:
  # Backend API (Node.js + Express + custom ORM)
  - type: web
    name: todo-app-backend
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci && npm run build --workspace=packages/orm && npm run build --workspace=apps/todo-app
    startCommand: node apps/todo-app/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 3000
